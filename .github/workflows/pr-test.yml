name: PR Tests

on:
  pull_request:
    branches: ["*"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify packed ESM and CommonJS exports
        run: npm run test:packages

      - name: Test Tempo content and persistence
        run: npm run test --workspace @react-chess-tools/tempo

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Tempo in production browsers
        run: npm run test:e2e --workspace @react-chess-tools/tempo

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npm run test-types
